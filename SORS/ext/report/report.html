<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Steam Order Scanner :: Report</title>
        <link rel="shortcut icon" href="../../ico/16.png" type="image/png" />

        <link rel="stylesheet" href="report.css" />
    </head>

    <body>
        <header class="report-header">
            <h1>Scan report</h1>
        </header>
        <main class="report-content">
            <section class="scan-summary" aria-live="polite">
                <p id="scanStatus">Ready to scan</p>
                <p id="scanCurrentItem" class="scan-current-item" hidden></p>
                <p id="scanCounts" class="scan-counts" hidden></p>
                <p id="scanIssue" class="scan-issue" hidden></p>
            </section>
            <div id="reportView" class="report-view" hidden>
                <span id="reportViewLabel"></span>
                <button id="switchReport" type="button" aria-controls="reportResults"></button>
            </div>
            <div id="reportResults">
                <p id="emptyReport" class="empty-report">Start a scan to see orders that match the scan conditions.</p>
                <table id="reportTable" aria-label="Orders at the highest bid or below the configured profit threshold" hidden>
                    <thead>
                        <tr>
                            <th scope="col" style="width: 7%"><button type="button" aria-label="Order number">#</button></th>
                            <th scope="col" style="width: 7%"><button type="button" aria-label="Application ID">APPID</button></th>
                            <th scope="col" style="width: 43%"><button type="button" aria-label="Name">NAME</button></th>
                            <th scope="col" style="width: 7%"><button type="button" aria-label="At highest buy price" title="At Steam's highest buy price. Queue order within the same price is unavailable.">1ST</button></th>
                            <th scope="col" style="width: 12%"><button type="button" aria-label="Order price">ORDER</button></th>
                            <th scope="col" style="width: 12%"><button type="button" aria-label="Market price">MARKET</button></th>
                            <th scope="col" style="width: 12%"><button type="button" aria-label="Profit">PROFIT</button></th>
                        </tr>
                    </thead>
                    <tbody id="badOrd"></tbody>
                </table>
            </div>
        </main>

        <footer>
            <p><b>LAST COMPLETED SCAN</b> <span id="lastScan">Not yet completed</span></p>
            <hr id="progress" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width: 0%; color: #0075ff" />
        </footer>

        <script src="report.js"></script>
    </body>
</html>
